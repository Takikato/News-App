version: "3.9"

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: mariadb:11.3
    restart: always
    environment:
      MARIADB_DATABASE: NovaNews
      MARIADB_USER: novanews_user
      MARIADB_PASSWORD: securepassword
      MARIADB_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
